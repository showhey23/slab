<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MITRE ATT&CK v19 攻撃ストーリー（2.5D俯瞰）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/story.css">
<link rel="stylesheet" href="css/xlink.css">
<script src="js/xlink.js"></script>
</head>
<body>
<header id="sbar">
  <div class="brand"><div class="ub"><b>MITRE ATT&amp;CK</b> v19 · 攻撃ストーリー</div><div class="us">ATTACK PATH · 2.5D OVERHEAD</div></div>
  <div class="xswitch" data-cur="td"></div>
  <div class="btns">
    <button class="sbtn kill" id="btnKill">⚡ クラウンジュエルへの最短路</button>
    <button class="sbtn three" id="btn3D">🧊 3D自由視点</button>
  </div>
</header>

<div id="slayout">
  <main id="scanvas">
    <div id="slegend">
      <span><i style="background:#E8788C"></i>攻撃パス：侵害済み</span>
      <span><i style="background:#E8788C;height:5px"></i>現在地（点滅）</span>
      <span><i style="background:#5C6B7F;height:2px"></i>未到達</span>
      <span><i class="dot" style="background:#3FBF8F"></i>防御ゲート 堅牢</span>
      <span><i class="dot" style="background:#D8A65A"></i>手薄</span>
      <span><i class="dot" style="background:#E8788C"></i>弱点</span>
      <span>⌖ 現在地 ／ ピン＝戦術</span>
    </div>
  </main>
  <aside id="spane"></aside>
</div>

<div id="stimeline"></div>

<div id="sxport">
  <button class="pbtn" id="btnBack" title="前のステップ">⏮</button>
  <button class="pbtn play" id="btnPlay" title="再生/一時停止">▶</button>
  <button class="pbtn" id="btnFwd" title="次のステップ">⏭</button>
  <button class="pbtn" id="btnRewind" title="最初へ">⟲</button>
  <div id="snow"></div>
  <div class="seg"><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button></div>
</div>

<div id="free3d">
  <div class="fh">🧊 3D自由視点（WebGL・副次機能）<button class="sbtn" id="free3dClose">✕ 閉じてストーリーへ戻る</button></div>
  <iframe id="free3dFrame" title="3D自由視点（WebGL）" loading="lazy"></iframe>
</div>

<div id="dataerr">
  <div style="font-size:34px">⚠</div>
  <div style="font-weight:700;font-size:16px;color:#EEF2F8">データを読み込めませんでした</div>
  <div class="m" style="max-width:560px;font-size:13px;line-height:1.7;color:#8A97AD"></div>
</div>

<script>(function(){
  var FAIL=function(msg){var e=document.getElementById("dataerr");if(e){e.style.display="flex";e.querySelector(".m").textContent=msg;}};
  fetch("data/attack_v19_data.json",{cache:"force-cache"})
   .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
   .then(function(d){window.__ATTACK_DATA__=d;var s=document.createElement("script");s.src="js/attack_story_app.js";
     s.onerror=function(){FAIL("アプリ(js/attack_story_app.js)の読み込みに失敗しました。");};document.body.appendChild(s);})
   .catch(function(err){FAIL("データ(data/attack_v19_data.json)の取得に失敗しました："+err.message+" ／ file:// では動作しません。GitHub Pages 等の HTTP 配信でご利用ください。");});
})();</script>
</body></html>
